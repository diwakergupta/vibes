<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube Solver</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2b32b2, #1488cc);
            user-select: none; /* Prevent text selection during drag */
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        button {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-size: 1rem;
            outline: none;
        }
        button:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }
        button:active {
            transform: translateY(0);
        }
        #btn-solve {
            background: #4CAF50;
            color: white;
        }
        #btn-solve:hover {
            background: #45a049;
        }
        #btn-scramble {
            background: #FF9800;
            color: white;
        }
        #btn-scramble:hover {
            background: #e68900;
        }
        #btn-reset {
            background: #2196F3;
            color: white;
        }
        #btn-reset:hover {
            background: #1976D2;
        }
        #controls-help {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            pointer-events: none;
        }
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        /* Sprinkles background animation */
        .sprinkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: float 10s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="controls-help">
        <strong>Controls:</strong><br>
        • Drag face to rotate<br>
        • Drag background to rotate view
    </div>
    <div id="status">Loading...</div>
    <div id="container"></div>
    <div id="ui">
        <button id="btn-reset">Reset</button>
        <button id="btn-scramble">Scramble</button>
        <button id="btn-solve">Solve</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/cube-solver@2.4.1/dist/bundle.js"></script>

    <script>
        // --- Configuration ---
        const COLORS = {
            U: 0xFFFFFF, // White
            D: 0xFFD500, // Yellow
            F: 0x009E60, // Green
            B: 0x0051BA, // Blue
            R: 0xC41E3A, // Red
            L: 0xFF5800, // Orange
            CORE: 0x202020 // Black (internal)
        };

        // --- Global Variables ---
        let scene, camera, renderer, controls;
        let cubeGroup;
        let cubes = [];
        let isAnimating = false;
        let raycaster, mouse;
        let audioCtx;
        let moveHistory = [];

        // Interaction State
        let isDragging = false;
        let dragStart = new THREE.Vector2();
        let dragCube = null;
        let dragNormal = null;
        let hoveredCube = null;

        // Sound
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'move') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'solve') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        // --- Initialization ---
        function init() {
            try {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(6, 5, 8);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                document.getElementById('container').appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.enablePan = false;
                controls.minDistance = 5;
                controls.maxDistance = 20;

                scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);
                const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
                backLight.position.set(-10, -10, -10);
                scene.add(backLight);

                createSprinkles();

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();

                createRubiksCube();

                window.addEventListener('resize', onWindowResize);
                window.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('contextmenu', e => e.preventDefault());

                document.getElementById('btn-reset').addEventListener('click', resetCube);
                document.getElementById('btn-scramble').addEventListener('click', scrambleCube);
                document.getElementById('btn-solve').addEventListener('click', solveCubeHandler);

                animate();

                if (typeof cubeSolver === 'undefined') {
                    document.getElementById('status').innerText = "Solver Lib Missing";
                } else {
                    document.getElementById('status').innerText = "Ready";
                }
            } catch (err) {
                console.error(err);
            }
        }

        function createSprinkles() {
            for(let i=0; i<50; i++) {
                const el = document.createElement('div');
                el.className = 'sprinkle';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (5 + Math.random() * 10) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(el);
            }
        }

        function createRubiksCube() {
            if (cubeGroup) scene.remove(cubeGroup);
            cubeGroup = new THREE.Group();
            scene.add(cubeGroup);
            cubes = [];

            const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const materials = [
                            new THREE.MeshPhongMaterial({ color: x === 1 ? COLORS.R : COLORS.CORE, name: 'R' }),
                            new THREE.MeshPhongMaterial({ color: x === -1 ? COLORS.L : COLORS.CORE, name: 'L' }),
                            new THREE.MeshPhongMaterial({ color: y === 1 ? COLORS.U : COLORS.CORE, name: 'U' }),
                            new THREE.MeshPhongMaterial({ color: y === -1 ? COLORS.D : COLORS.CORE, name: 'D' }),
                            new THREE.MeshPhongMaterial({ color: z === 1 ? COLORS.F : COLORS.CORE, name: 'F' }),
                            new THREE.MeshPhongMaterial({ color: z === -1 ? COLORS.B : COLORS.CORE, name: 'B' }),
                        ];

                        const mesh = new THREE.Mesh(geometry, materials);
                        mesh.position.set(x, y, z);
                        mesh.userData = { isCube: true };
                        cubeGroup.add(mesh);
                        cubes.push(mesh);
                    }
                }
            }
            moveHistory = [];
        }

        // --- Interaction: Drag to Rotate ---
        function onMouseDown(event) {
            if (isAnimating) return;
            if (event.target.tagName === 'BUTTON') return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);

            if (intersects.length > 0) {
                controls.enabled = false;
                isDragging = true;
                dragStart.copy(mouse);
                dragCube = intersects[0].object;
                dragNormal = intersects[0].face.normal.clone().transformDirection(dragCube.matrixWorld).round();
            }
        }

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            if (isDragging && dragCube) {
                const delta = new THREE.Vector2().subVectors(mouse, dragStart);
                if (delta.length() > 0.05) { // Drag threshold
                    handleDrag(delta);
                    isDragging = false;
                    controls.enabled = true;
                }
            } else {
                // Hover Logic
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(cubes);

                // Restore previous hover
                if (hoveredCube && (!intersects.length || intersects[0].object !== hoveredCube)) {
                     hoveredCube.material.forEach(m => {
                         if (m.emissive) m.emissive.setHex(0x000000);
                     });
                     hoveredCube = null;
                }

                // Set new hover
                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    if (object !== hoveredCube) {
                        hoveredCube = object;
                        object.material.forEach(m => {
                            if (m.emissive) m.emissive.setHex(0x444444);
                        });
                    }
                }
            }
        }

        function onMouseUp() {
            isDragging = false;
            controls.enabled = true;
        }

        function handleDrag(delta) {
            if (!dragCube || !dragNormal) return;

            // Determine Drag Direction in World Space by projecting axes
            const dirs = {
                x: new THREE.Vector3(1,0,0),
                y: new THREE.Vector3(0,1,0),
                z: new THREE.Vector3(0,0,1)
            };

            // Possible movement axes (orthogonal to face normal)
            const normalAxis = Math.abs(dragNormal.x)>0.5 ? 'x' : (Math.abs(dragNormal.y)>0.5 ? 'y' : 'z');
            const possibleAxes = ['x','y','z'].filter(k => k !== normalAxis);

            let bestMatch = null;
            let maxDot = 0;

            possibleAxes.forEach(axis => {
                const worldDir = dirs[axis].clone();
                const screenDir = worldDir.project(camera).clone();
                const screenDir2D = new THREE.Vector2(screenDir.x, screenDir.y).normalize();

                const dot = delta.clone().normalize().dot(screenDir2D);
                if (Math.abs(dot) > maxDot) {
                    maxDot = Math.abs(dot);
                    bestMatch = { axis: axis, sign: Math.sign(dot) };
                }
            });

            if (!bestMatch || maxDot < 0.5) return; // Not aligned enough

            const moveAxis = bestMatch.axis;
            const rotAxis = ['x','y','z'].find(k => k !== normalAxis && k !== moveAxis);
            const slice = Math.round(dragCube.position[rotAxis]);

            if (slice === 0) return; // Ignore middle slice for now

            // Identify Face
            let face = '';
            if (rotAxis === 'x' && slice === 1) face = 'R';
            if (rotAxis === 'x' && slice === -1) face = 'L';
            if (rotAxis === 'y' && slice === 1) face = 'U';
            if (rotAxis === 'y' && slice === -1) face = 'D';
            if (rotAxis === 'z' && slice === 1) face = 'F';
            if (rotAxis === 'z' && slice === -1) face = 'B';

            if (!face) return;

            // Calculate Direction
            const map = {x:0, y:1, z:2};
            const iN = map[normalAxis];
            const iM = map[moveAxis];
            // Cross Product Order: (iN + 1) % 3 === iM ? +1 : -1
            const crossSign = ((iN + 1) % 3 === iM) ? 1 : -1;

            // Physical Rotation Direction along RotAxis:
            const physicalDir = bestMatch.sign * crossSign;

            // Standard Face CW Rotation (looking from face side)
            // R (Slice 1, RotAxis X): CW is -PI/2. (Physical Dir -1)
            // L (Slice -1, RotAxis X): CW is +PI/2. (Physical Dir +1)
            // U (Slice 1, RotAxis Y): CW is -PI/2. (Physical Dir -1)
            // D (Slice -1, RotAxis Y): CW is +PI/2. (Physical Dir +1)
            // F (Slice 1, RotAxis Z): CW is -PI/2. (Physical Dir -1)
            // B (Slice -1, RotAxis Z): CW is +PI/2. (Physical Dir +1)

            // Pattern: If slice is 1, CW is -1. If slice is -1, CW is +1.
            const idealCWDir = (slice === 1) ? -1 : 1;

            let modifier = '';
            if (physicalDir === idealCWDir) {
                modifier = ''; // CW
            } else {
                modifier = "'"; // CCW
            }

            const move = face + modifier;
            console.log("Drag Move:", move);
            performMove(move);
        }

        // --- Logic: Rotation & Moves ---
        function performMove(move, skipHistory = false) {
            return new Promise(resolve => {
                if (!move) { resolve(); return; }

                const face = move[0];
                const modifier = move.length > 1 ? move[1] : '';

                if (!skipHistory) {
                    moveHistory.push(move);
                    console.log("History:", moveHistory.join(" "));
                }

                let axis, slice, angle;
                const duration = 200;
                const HPI = Math.PI/2;

                switch(face) {
                    case 'U': axis='y'; slice=1; angle=-HPI; break;
                    case 'D': axis='y'; slice=-1; angle=HPI; break;
                    case 'R': axis='x'; slice=1; angle=-HPI; break;
                    case 'L': axis='x'; slice=-1; angle=HPI; break;
                    case 'F': axis='z'; slice=1; angle=-HPI; break;
                    case 'B': axis='z'; slice=-1; angle=HPI; break;
                }

                if (modifier === "'") {
                    angle *= -1;
                } else if (modifier === "2") {
                    angle *= 2;
                }

                rotateLayer(axis, slice, angle, duration, resolve);
            });
        }

        function rotateLayer(axis, slice, angle, duration, callback) {
            if (isAnimating) return;
            isAnimating = true;
            playSound('move');

            const activeCubes = cubes.filter(c => Math.round(c.position[axis]) === slice);

            const pivot = new THREE.Object3D();
            pivot.rotation.set(0, 0, 0);
            cubeGroup.add(pivot);

            activeCubes.forEach(c => pivot.attach(c));

            const targetRotation = {};
            targetRotation[axis] = angle;

            new TWEEN.Tween(pivot.rotation)
                .to(targetRotation, duration)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => {
                    pivot.updateMatrixWorld();
                    activeCubes.forEach(c => {
                        cubeGroup.attach(c);
                        c.position.x = Math.round(c.position.x);
                        c.position.y = Math.round(c.position.y);
                        c.position.z = Math.round(c.position.z);
                        c.rotation.x = Math.round(c.rotation.x / (Math.PI/2)) * (Math.PI/2);
                        c.rotation.y = Math.round(c.rotation.y / (Math.PI/2)) * (Math.PI/2);
                        c.rotation.z = Math.round(c.rotation.z / (Math.PI/2)) * (Math.PI/2);
                        c.updateMatrix();
                    });
                    cubeGroup.remove(pivot);
                    isAnimating = false;
                    if (callback) callback();
                })
                .start();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            controls.update();
            renderer.render(scene, camera);
        }

        async function solveCubeHandler() {
            if (isAnimating) return;
            if (typeof cubeSolver === 'undefined') {
                document.getElementById('status').innerText = "Solver Missing";
                return;
            }
            if (moveHistory.length === 0) {
                 document.getElementById('status').innerText = "Already Solved!";
                 playWin();
                 return;
            }

            document.getElementById('status').innerText = "Solving...";
            const scramble = moveHistory.join(' ');

            setTimeout(async () => {
                try {
                    const solution = cubeSolver.solve(scramble);
                    if (!solution) {
                        document.getElementById('status').innerText = "Solved?";
                        moveHistory = [];
                        return;
                    }
                    const moves = solution.trim().split(/\s+/);
                    await applySolution(moves);
                    moveHistory = [];
                } catch (e) {
                    console.error(e);
                    document.getElementById('status').innerText = "Solver Error";
                }
            }, 100);
        }

        async function applySolution(moves) {
            for (let move of moves) {
                if (!move) continue;
                await performMove(move, true);
            }
            document.getElementById('status').innerText = "Solved!";
            playWin();
        }

        function playWin() {
            playSound('solve');
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function scrambleCube() {
             if (isAnimating) return;
             const faces = ['U','D','R','L','F','B'];
             const mods = ['','\'','2'];
             let scrambleMoves = [];
             if (typeof cubeSolver !== 'undefined' && cubeSolver.scramble) {
                 scrambleMoves = cubeSolver.scramble().split(' ');
             } else {
                 for(let i=0; i<20; i++) {
                     scrambleMoves.push(faces[Math.floor(Math.random()*6)] + mods[Math.floor(Math.random()*3)]);
                 }
             }
             (async () => {
                 for (let move of scrambleMoves) await performMove(move);
                 document.getElementById('status').innerText = "Scrambled";
             })();
        }

        function resetCube() {
            if (isAnimating) return;
            createRubiksCube();
            document.getElementById('status').innerText = "Reset";
        }

        init();
    </script>
</body>
</html>
