<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Fast, simple, delightful chromatic tuner. No ads, no accounts, just tune.">
  <meta name="theme-color" content="#111113">
  <title>Tuner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ── Start screen ──────────────────── -->
    <div class="start-screen" id="start-screen" role="main">
      <div class="start-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <h1 class="start-title">Tuner</h1>
      <p class="start-sub">Play any note on your instrument and see instant visual feedback. Works with guitar, bass, ukulele, and more.</p>
      <button class="start-btn" id="start-btn" aria-label="Start tuner and enable microphone">Start Tuning</button>
    </div>

    <!-- ── Error screen ──────────────────── -->
    <div class="error-screen" id="error-screen" role="alert">
      <div class="error-icon" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.12 1.5-.35 2.18"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <h2 class="error-title" id="error-title">Microphone blocked</h2>
      <p class="error-message" id="error-message">Please allow microphone access and try again.</p>
      <button class="error-retry" id="error-retry">Try Again</button>
    </div>

    <!-- ── Tuner screen ──────────────────── -->
    <div class="tuner-screen" id="tuner-screen" role="main" aria-live="polite">
      <div class="status" id="status" aria-label="Tuner status">Listening...</div>

      <div class="radial-meter" id="meter-wrap" role="slider" aria-label="Tuning meter — tap to freeze" aria-valuemin="-50" aria-valuemax="50" aria-valuenow="0" tabindex="0">
        <svg class="radial-svg" id="radial-svg" viewBox="0 0 400 400">
          <g id="arc-segments"></g>
          <circle class="inner-ring" id="inner-ring" cx="200" cy="200" r="105" fill="none" stroke="#2DD4A8" stroke-width="8" opacity="0.35"/>
          <g class="needle-group" id="needle-group">
            <path class="needle" d="M200,35 L191,170 Q200,200 209,170 Z" fill="#2DD4A8"/>
          </g>
          <circle class="needle-cap" cx="200" cy="200" r="6" fill="#1a1a1e"/>
          <text class="arc-label" x="53" y="310" text-anchor="middle">-50</text>
          <text class="arc-label" x="347" y="310" text-anchor="middle">+50</text>
        </svg>
        <div class="radial-note" id="note-name" aria-label="Detected note">&mdash;</div>
        <div class="meter-frozen-badge">Frozen</div>
      </div>

      <div class="note-freq" id="note-freq" aria-label="Detected frequency"></div>
      <div class="cents-display" id="cents-display" aria-label="Cents deviation"></div>
      <div class="message-toast" id="message-toast" aria-live="assertive"></div>
      <div class="streak hidden" id="streak" aria-label="Tuning streak"></div>
    </div>

    <!-- ── Particles ─────────────────────── -->
    <div class="particle-container" id="particles" aria-hidden="true"></div>
  </div>

  <!-- ── Settings toggle ───────────────── -->
  <button class="settings-toggle" id="settings-toggle" aria-label="Open settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <!-- ── Settings panel ────────────────── -->
  <div class="settings-backdrop" id="settings-backdrop"></div>
  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Settings">
    <div class="settings-header">
      <h2 class="settings-title">Settings</h2>
      <button class="settings-close" id="settings-close" aria-label="Close settings">&times;</button>
    </div>

    <div class="setting-group">
      <label class="setting-label" for="a4-select">A4 Reference</label>
      <select class="setting-select" id="a4-select">
        <option value="432">432 Hz</option>
        <option value="440" selected>440 Hz</option>
        <option value="442">442 Hz</option>
        <option value="444">444 Hz</option>
        <option value="custom">Custom...</option>
      </select>
      <input class="setting-input" id="a4-custom" type="number" min="400" max="480" placeholder="e.g. 435" style="display:none" aria-label="Custom A4 frequency">
    </div>

    <div class="setting-group">
      <label class="setting-label" for="theme-select">Appearance</label>
      <select class="setting-select" id="theme-select">
        <option value="auto">Auto (system)</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-row">
        <label class="setting-label" for="sound-toggle" style="margin:0">Sound Feedback</label>
        <label class="toggle">
          <input type="checkbox" id="sound-toggle">
          <span class="toggle-track"></span>
          <span class="toggle-knob"></span>
        </label>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
